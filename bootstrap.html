<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <title>Bootstrap Example</title> 
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <link rel="stylesheet" 
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"> 
  <script 
src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script> 
  <script 
src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script> 
</head> 
<body> 
 
<div class="container mt-5">
  <div class="card">
    <div class="card-body">
      <!-- Logo placeholder -->
      <div class="text-center mb-4">
        <img src="https://via.placeholder.com/100" alt="IU Logo" class="rounded-circle">
      </div>
      
      <!-- Survey Title -->
      <h2 class="text-primary">Survey</h2>
      <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
      
      <!-- Survey Form -->
      <form>
        <h5 class="text-info mt-4">Your information:</h5>
        
        <!-- First Name -->
        <div class="form-group row">
          <label for="firstName" class="col-sm-3 col-form-label">First Name</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="firstName" name="firstName">
          </div>
        </div>
        
        <!-- Last Name -->
        <div class="form-group row">
          <label for="lastName" class="col-sm-3 col-form-label">Last Name</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="lastName" name="lastName">
          </div>
        </div>
        
        <!-- Email -->
        <div class="form-group row">
          <label for="email" class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9">
            <input type="email" class="form-control" id="email" name="email">
          </div>
        </div>
        
        <!-- Date of Birth -->
        <div class="form-group row">
          <label for="dob" class="col-sm-3 col-form-label">Date of Birth</label>
          <div class="col-sm-9">
            <input type="date" class="form-control" id="dob" name="dob">
          </div>
        </div>
        
        <!-- How did you hear about us -->
        <h5 class="text-info mt-4">How did you hear about us?</h5>
        <div class="form-group">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="hearAbout" id="searchEngine" value="search" checked>
            <label class="form-check-label" for="searchEngine">Search engine</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="hearAbout" id="wordOfMouth" value="word">
            <label class="form-check-label" for="wordOfMouth">Word of mouth</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="hearAbout" id="socialMedia" value="social">
            <label class="form-check-label" for="socialMedia">Social Media</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="hearAbout" id="other" value="other">
            <label class="form-check-label" for="other">Other</label>
          </div>
        </div>
        
        <!-- Announcements -->
        <h5 class="text-info mt-4">Would you like to receive announcements about new CDs and special offers?</h5>
        <div class="form-group">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="likeThat" name="likeThat">
            <label class="form-check-label" for="likeThat">
              YES, I'd like that.
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="emailAnnouncements" name="emailAnnouncements">
            <label class="form-check-label" for="emailAnnouncements">
              YES, please send me email announcements.
            </label>
          </div>
        </div>
        
      </form>
      
    </div>
  </div>
</div>
 
</body>
</html>
