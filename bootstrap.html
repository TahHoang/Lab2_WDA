<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <title>IU Survey Form</title> 
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <link rel="stylesheet" 
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"> 
  <script 
src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script> 
  <script 
src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script> 
  <style>
    body {
      background-color: #f8f9fa;
    }
    .survey-card {
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-section {
      border-left: 3px solid #17a2b8;
      padding-left: 15px;
      margin-top: 20px;
    }
  </style>
</head> 
<body> 
 
<div class="container mt-5 mb-5">
  <div class="card survey-card">
    <div class="card-body p-4">
      <!-- Logo placeholder -->
      <div class="text-center mb-4">
        <img src="https://via.placeholder.com/100" alt="IU Logo" class="rounded-circle border border-primary">
      </div>
      
      <!-- Survey Title -->
      <h2 class="text-primary text-center mb-3">Survey</h2>
      <p class="text-center text-muted mb-4">If you have a moment, we'd appreciate it if you would fill out this survey.</p>
      
      <!-- Survey Form -->
      <form>
        <div class="form-section">
          <h5 class="text-info mb-3">Your information:</h5>
          
          <!-- First Name -->
          <div class="form-group row">
            <label for="firstName" class="col-sm-3 col-form-label font-weight-bold">First Name</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter your first name">
            </div>
          </div>
          
          <!-- Last Name -->
          <div class="form-group row">
            <label for="lastName" class="col-sm-3 col-form-label font-weight-bold">Last Name</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter your last name">
            </div>
          </div>
          
          <!-- Email -->
          <div class="form-group row">
            <label for="email" class="col-sm-3 col-form-label font-weight-bold">Email</label>
            <div class="col-sm-9">
              <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com">
            </div>
          </div>
          
          <!-- Date of Birth -->
          <div class="form-group row">
            <label for="dob" class="col-sm-3 col-form-label font-weight-bold">Date of Birth</label>
            <div class="col-sm-9">
              <input type="date" class="form-control" id="dob" name="dob">
            </div>
          </div>
        </div>
        
        <!-- How did you hear about us -->
        <div class="form-section">
          <h5 class="text-info mb-3">How did you hear about us?</h5>
          <div class="form-group">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="hearAbout" id="searchEngine" value="search" checked>
              <label class="form-check-label" for="searchEngine">Search engine</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="hearAbout" id="wordOfMouth" value="word">
              <label class="form-check-label" for="wordOfMouth">Word of mouth</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="hearAbout" id="socialMedia" value="social">
              <label class="form-check-label" for="socialMedia">Social Media</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="hearAbout" id="other" value="other">
              <label class="form-check-label" for="other">Other</label>
            </div>
          </div>
        </div>
        
        <!-- Announcements -->
        <div class="form-section">
          <h5 class="text-info mb-3">Would you like to receive announcements about new CDs and special offers?</h5>
          <div class="form-group">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="likeThat" name="likeThat">
              <label class="form-check-label" for="likeThat">
                YES, I'd like that.
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="emailAnnouncements" name="emailAnnouncements">
              <label class="form-check-label" for="emailAnnouncements">
                YES, please send me email announcements.
              </label>
            </div>
          </div>
        </div>
        
        <!-- Contact Preference -->
        <div class="form-group row mt-3">
          <label for="contactMethod" class="col-sm-3 col-form-label">Please contact me by:</label>
          <div class="col-sm-9">
            <select class="form-control" id="contactMethod" name="contactMethod">
              <option value="email-postal">Email or postal mail</option>
              <option value="email">Email only</option>
              <option value="postal">Postal mail only</option>
            </select>
          </div>
        </div>
        
        <!-- Submit Button -->
        <div class="form-group row">
          <div class="col-sm-12">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </div>
        
      </form>
      
    </div>
  </div>
</div>
 
</body>
</html>
