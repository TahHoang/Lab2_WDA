<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2 - Flexbox Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #d4b896;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: #fff;
      border: 2px solid #999;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #f5f5f5;
      padding: 20px;
      border-bottom: 1px solid #ccc;
      font-weight: bold;
      font-size: 18px;
    }

    .content-wrapper {
      display: flex;
      flex-direction: row;
      min-height: 400px;
    }

    .sidebar-a {
      width: 150px;
      background-color: #f9f9f9;
      border-right: 1px solid #ccc;
      padding: 20px;
      font-weight: bold;
    }

    .main-content {
      flex: 1;
      background-color: #fff;
      border-right: 1px solid #ccc;
      padding: 20px;
      font-weight: bold;
    }

    .sidebar-b {
      width: 150px;
      background-color: #f9f9f9;
      padding: 20px;
      font-weight: bold;
    }

    .footer {
      background-color: #f5f5f5;
      padding: 20px;
      border-top: 1px solid #ccc;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      Header
    </div>
    
    <div class="content-wrapper">
      <div class="sidebar-a">
        Sidebar A
      </div>
      
      <div class="main-content">
        Main content
      </div>
      
      <div class="sidebar-b">
        Sidebar B
      </div>
    </div>
    
    <div class="footer">
      Footer
    </div>
  </div>
</body>
</html>
